<!doctype html>
<html>
  <head>
    <title>Password Strength</title>

    <style>
      body {
        margin: 0;
        font-family: Arial;
        background: linear-gradient(135deg, #00b09b, #96c93d);
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
      }

      .container {
        background: white;
        padding: 30px;
        border-radius: 12px;
        text-align: center;
        width: 320px;
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
      }

      input {
        width: 80%;
        padding: 10px;
        margin-top: 10px;
        border-radius: 8px;
        border: 1px solid #ccc;
      }

      #msg {
        margin-top: 10px;
        font-weight: bold;
      }
    </style>
  </head>
</html>
