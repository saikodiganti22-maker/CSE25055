<!DOCTYPE html>
<html>
  <head>
    <title>Week 10 Programs</title>

    <style>
      body {
        font-family: Arial, sans-serif;
        background: #f4f6f8;
        margin: 0;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
      }

      .container {
        background: #fff;
        border-radius: 10px;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        width: 600px;
        display: flex;
        overflow: hidden;
      }

      .left {
        width: 45%;
        padding: 20px;
        border-right: 1px solid #eee;
      }

      .right {
        width: 55%;
        padding: 20px;
      }

      h3 {
        margin-bottom: 15px;
        color: #333;
      }

      button {
        width: 100%;
        padding: 10px;
        margin: 6px 0;
        border: none;
        border-radius: 6px;
        background: #4a90e2;
        color: white;
        cursor: pointer;
        font-size: 14px;
      }

      button:hover {
        background: #357abd;
      }

      #output {
        background: #f1f5f9;
        padding: 15px;
        border-radius: 6px;
        min-height: 200px;
        font-size: 14px;
        color: #333;
        line-height: 1.5;
      }
    </style>
  </head>

  <body>
    <div class="container">
      <div class="left">
        <h3>Functions</h3>

        <button onclick="signProduct()">Sign of Product</button>
        <button onclick="sortNumbers()">Sort Numbers</button>
        <button onclick="largest()">Largest Number</button>
        <button onclick="oddEven()">Odd / Even 0-15</button>
        <button onclick="grade()">Student Grade</button>
      </div>

      <div class="right">
        <h3>Output</h3>
        <div id="output">Result will appear here</div>
      </div>
    </div>

    <script>
      // A) Sign of Product
      function signProduct() {
        let a = prompt("Enter first number:");
        let b = prompt("Enter second number:");
        let c = prompt("Enter third number:");

        let p = a * b * c;

        if (p > 0) show("Sign is +");
        else if (p < 0) show("Sign is -");
        else show("Zero");
      }

      // B) Sort Numbers
      function sortNumbers() {
        let a = parseInt(prompt("Enter first number:"));
        let b = parseInt(prompt("Enter second number:"));
        let c = parseInt(prompt("Enter third number:"));

        let arr = [a, b, c];
        arr.sort((x, y) => x - y);

        show("Sorted: " + arr.join(", "));
      }

      // C) Largest of 5
      function largest() {
        let max = -Infinity;

        for (let i = 1; i <= 5; i++) {
          let n = parseInt(prompt("Enter number " + i));
          if (n > max) max = n;
        }

        show("Largest Number: " + max);
      }

      // D) Odd / Even
      function oddEven() {
        let result = "";

        for (let i = 0; i <= 15; i++) {
          result += i + " is " + (i % 2 == 0 ? "Even" : "Odd") + "<br>";
        }

        show(result);
      }

      // E) Grade
      function grade() {
        let total = 0;

        for (let i = 1; i <= 6; i++) {
          total += parseInt(prompt("Enter mark " + i));
        }

        let avg = total / 6;
        let grade;

        if (avg >= 90) grade = "A";
        else if (avg >= 75) grade = "B";
        else if (avg >= 60) grade = "C";
        else if (avg >= 50) grade = "D";
        else grade = "F";

        show("Average: " + avg + "<br>Grade: " + grade);
      }

      // Output
      function show(msg) {
        document.getElementById("output").innerHTML = msg;
      }
    </script>
  </body>
</html>
