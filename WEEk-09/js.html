<!doctype html>
<html lang="en">
  <head></head>
  <body>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <script>
      for (let a = 0; a <= 10; a = a + 2) {
        document.write("Current value:" + a);
        document.write("</br>");
      }
      document.write("</br>");

      let b = 10;
      do {
        document.write("do executed <br/>");
        b++;
      } while (b < 15);
      document.write("</br>");
      let c = 1;
      switch (c) {
        case 1:
          document.write("case 1 has been executed");
          break;
        case 2:
          document.write("case 2 has been executed");
          break;
        default:
          document.write("default case  has been executed");
      }
    </script>
  </body>
</html>
